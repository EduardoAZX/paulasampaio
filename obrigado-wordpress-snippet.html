  1. WP Admin → Páginas → Adicionar nova

<style>

  .ps-ty-dot{width:6px;height:6px;border-radius:50%;background:#a8456e;box-shadow:0 0 8px rgba(194,123,154,0.30);}
  .ps-ty-title{

    color:#1a1212;line-height:1.15;margin:0 0 16px;
  }
  .ps-ty-title span{
    background:linear-gradient(135deg,#a8456e 0%,#c27b9a 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .ps-ty-body{font-size:15px;color:#6f5c5c;line-height:1.75;margin:0 0 10px;}
  .ps-ty-time{

    border-radius:100px;padding:6px 14px;margin:18px 0 32px;
  }
  .ps-ty-time svg{width:13px;height:13px;flex-shrink:0;}
  .ps-ty-actions{display:flex;flex-direction:column;gap:12px;}
  .ps-ty-wa{
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:#25d366;color:#fff;border:none;border-radius:12px;padding:15px 32px;
    font-size:15px;font-weight:600;text-decoration:none;
    transition:opacity .2s,transform .15s,box-shadow .2s;box-shadow:0 4px 24px rgba(37,211,102,0.28);
  }
  .ps-ty-wa:hover{opacity:.9;transform:translateY(-2px);box-shadow:0 8px 36px rgba(37,211,102,0.40);}
  .ps-ty-wa svg{width:20px;height:20px;flex-shrink:0;}
  .ps-ty-back{
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:none;color:#6f5c5c;border:1px solid rgba(194,123,154,0.14);border-radius:12px;
    padding:13px 32px;font-size:14px;font-weight:500;text-decoration:none;
    transition:color .2s,border-color .2s;
  }
  .ps-ty-back:hover{color:#1a1212;border-color:rgba(194,123,154,0.35);}
  .ps-ty-back svg{width:15px;height:15px;flex-shrink:0;}
  @keyframes psFadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  @keyframes psPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @media(max-width:480px){.ps-ty-card{padding:40px 24px}}
</style>
